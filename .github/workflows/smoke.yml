name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: install optional test deps (jsonschema for check #7)
        run: pip install -r tests/requirements-test.txt

      - name: run genome-atlas smoke tests
        run: python3 tests/smoke_genome_atlas.py

      - name: run smoke-script self-tests
        run: python3 tests/test_smoke_checks.py
